<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Coletor RFID - Prensa & Carregamento</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 16px; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; }
    h1 { font-size: 1.2rem; text-align: center; margin: 0 0 16px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    .menu-grid { display: flex; flex-direction: column; gap: 16px; flex: 1; justify-content: center; }
    .btn-op { padding: 32px 20px; font-size: 1.5rem; font-weight: 800; border: none; border-radius: 16px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 6px 16px rgba(0,0,0,0.4); transition: transform 0.1s; }
    .btn-op:active { transform: scale(0.98); }
    .btn-prensa { background: #16a34a; color: #fff; }
    .btn-carregamento { background: #2563eb; color: #fff; }
    .painel-op { display: none; flex-direction: column; flex: 1; }
    .header-op { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; font-weight: 800; font-size: 1.1rem; }
    .header-prensa { background: #16a34a; }
    .header-carregamento { background: #2563eb; }
    .btn-voltar { background: rgba(0,0,0,0.3); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .status-box { background: #1e293b; border: 2px dashed #475569; border-radius: 16px; padding: 28px 16px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; }
    .epc-tag { font-family: monospace; font-size: 1.05rem; background: #0f172a; padding: 8px 12px; border-radius: 8px; color: #38bdf8; word-break: break-all; }
    .peso-valor { font-size: 2.8rem; font-weight: 900; color: #facc15; margin: 8px 0; }
    .alerta-erro { background: #7f1d1d; border: 2px solid #ef4444; color: #fecaca; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 1.05rem; width: 100%; }
    .alerta-ok { background: #14532d; border: 2px solid #22c55e; color: #bbf7d0; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 1.05rem; width: 100%; }
    .acoes-grid { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 12px; }
    .btn-acao { padding: 18px; font-size: 1.15rem; font-weight: 800; border: none; border-radius: 12px; cursor: pointer; text-transform: uppercase; width: 100%; }
    .btn-confirmar { background: #22c55e; color: #052e16; }
    .btn-refazer { background: #dc2626; color: #fff; }
    .btn-neutro { background: #475569; color: #fff; }
    .btn-acao:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- TELA INICIAL -->
  <div id="telaInicial" class="menu-grid">
    <h1>Selecione a Operação</h1>
    <button class="btn-op btn-prensa" onclick="selecionarOperacao('PRENSA')">PRENSA</button>
    <button class="btn-op btn-carregamento" onclick="selecionarOperacao('CARREGAMENTO')">CARREGAMENTO</button>
  </div>

  <!-- TELA DE OPERAÇÃO ATIVA -->
  <div id="telaOperacao" class="painel-op">
    <div id="headerOp" class="header-op">
      <span id="tituloOp">PRENSA</span>
      <button class="btn-voltar" onclick="voltarInicio()">TROCAR</button>
    </div>

    <div id="areaConteudo" class="status-box">
      <div style="font-size: 1.2rem; color: #94a3b8;">Aguardando leitura de 1 etiqueta RFID...</div>
      <div style="font-size: 0.9rem; color: #64748b;">Pressione o gatilho do coletor</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, deleteDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC0un-r4Qi-zpkvmkJitmYfVg4FFSuBhUA",
      authDomain: "controle-fardos-rfid.firebaseapp.com",
      projectId: "controle-fardos-rfid",
      storageBucket: "controle-fardos-rfid.firebasestorage.app",
      messagingSenderId: "811246572619",
      appId: "1:811246572619:web:ee9fc742ea183bc84d29ce"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let operacaoAtual = null;
    let epcAtual = null;
    let pesoAtual = null;
    let processando = false;

    function liberarColetor() {
      epcAtual = null;
      pesoAtual = null;
      processando = false;
      if (window.AndroidSingleTag && typeof window.AndroidSingleTag.liberarProximaEtiqueta === "function") {
        window.AndroidSingleTag.liberarProximaEtiqueta();
      }
    }

    function resetarTelaEspera(mensagemExtra = "") {
      liberarColetor();
      const area = document.getElementById("areaConteudo");
      area.innerHTML = `
        ${mensagemExtra}
        <div style="font-size: 1.2rem; color: #94a3b8;">Aguardando leitura de 1 etiqueta RFID...</div>
        <div style="font-size: 0.9rem; color: #64748b;">Pressione o gatilho do coletor</div>
      `;
    }

    window.selecionarOperacao = function(op) {
      operacaoAtual = op;
      document.getElementById("telaInicial").style.display = "none";
      document.getElementById("telaOperacao").style.display = "flex";
      const header = document.getElementById("headerOp");
      const titulo = document.getElementById("tituloOp");
      titulo.textContent = op;
      header.className = "header-op " + (op === "PRENSA" ? "header-prensa" : "header-carregamento");
      resetarTelaEspera();
    };

    window.voltarInicio = function() {
      operacaoAtual = null;
      liberarColetor();
      document.getElementById("telaOperacao").style.display = "none";
      document.getElementById("telaInicial").style.display = "flex";
    };

    function gerarPesoSimulado() {
      // Gera peso realista entre 180.00 kg e 245.00 kg
      return Number((180 + Math.random() * 65).toFixed(2));
    }

    async function registrarBloqueio(epc, motivo) {
      try {
        await addDoc(collection(db, "logs_bloqueios"), {
          epc: epc,
          operacao_tentada: operacaoAtual,
          motivo_bloqueio: motivo,
          dispositivo: "Bluebird-EF401",
          criado_em: serverTimestamp()
        });
      } catch (e) {
        console.error("Erro ao gravar log de bloqueio:", e);
      }
    }

    // Função chamada pelo Android (InventoryFragment.java)
    window.receberRFID = async function(epcRecebido) {
      const epc = (epcRecebido || "").trim().toUpperCase();
      if (!epc) {
        liberarColetor();
        return;
      }

      if (!operacaoAtual) {
        alert("Selecione PRENSA ou CARREGAMENTO antes de ler uma etiqueta.");
        liberarColetor();
        return;
      }

      if (processando) return;
      processando = true;
      epcAtual = epc;

      const area = document.getElementById("areaConteudo");
      area.innerHTML = `<div style="color:#38bdf8; font-weight:700;">Consultando nuvem...</div><div class="epc-tag">${epc}</div>`;

      try {
        const estoqueRef = doc(db, "estoque_atual", epc);
        const snap = await getDoc(estoqueRef);

        if (operacaoAtual === "PRENSA") {
          if (snap.exists()) {
            const motivo = "Etiqueta já está em estoque (tentativa duplicada na PRENSA).";
            await registrarBloqueio(epc, motivo);
            area.innerHTML = `
              <div class="alerta-erro">BLOQUEADO!<br>Esta etiqueta JÁ ESTÁ EM ESTOQUE.</div>
              <div class="epc-tag">${epc}</div>
              <div class="acoes-grid">
                <button class="btn-acao btn-neutro" onclick="cancelarLeitura()">LER PRÓXIMA ETIQUETA</button>
              </div>
            `;
            return;
          }

          pesoAtual = gerarPesoSimulado();
          area.innerHTML = `
            <div style="color:#94a3b8; font-weight:700;">ETIQUETA LIBERADA PARA PRENSA</div>
            <div class="epc-tag">${epc}</div>
            <div class="peso-valor">${pesoAtual.toFixed(2)} kg</div>
            <div class="acoes-grid">
              <button id="btnConfirmar" class="btn-acao btn-confirmar" onclick="confirmarPrensa()">CONFIRMAR GRAVAÇÃO</button>
              <button class="btn-acao btn-refazer" onclick="cancelarLeitura()">REFAZER</button>
            </div>
          `;

        } else if (operacaoAtual === "CARREGAMENTO") {
          if (!snap.exists()) {
            const motivo = "Etiqueta não encontrada no estoque (tentativa de CARREGAMENTO sem entrada).";
            await registrarBloqueio(epc, motivo);
            area.innerHTML = `
              <div class="alerta-erro">BLOQUEADO!<br>Esta etiqueta NÃO ESTÁ NO ESTOQUE.</div>
              <div class="epc-tag">${epc}</div>
              <div class="acoes-grid">
                <button class="btn-acao btn-neutro" onclick="cancelarLeitura()">LER PRÓXIMA ETIQUETA</button>
              </div>
            `;
            return;
          }

          const dadosEstoque = snap.data();
          pesoAtual = Number(dadosEstoque.peso_kg || 0);
          area.innerHTML = `
            <div style="color:#94a3b8; font-weight:700;">FARDO LOCALIZADO NO ESTOQUE</div>
            <div class="epc-tag">${epc}</div>
            <div class="peso-valor">${pesoAtual.toFixed(2)} kg</div>
            <div class="acoes-grid">
              <button id="btnConfirmar" class="btn-acao btn-confirmar" onclick="confirmarCarregamento()">CONFIRMAR BAIXA</button>
              <button class="btn-acao btn-refazer" onclick="cancelarLeitura()">CANCELAR</button>
            </div>
          `;
        }
      } catch (err) {
        area.innerHTML = `
          <div class="alerta-erro">Erro de conexão com a nuvem:<br>${err.message}</div>
          <div class="acoes-grid">
            <button class="btn-acao btn-neutro" onclick="cancelarLeitura()">TENTAR NOVAMENTE</button>
          </div>
        `;
      }
    };

    window.confirmarPrensa = async function() {
      const btn = document.getElementById("btnConfirmar");
      if (btn) btn.disabled = true;

      try {
        await setDoc(doc(db, "estoque_atual", epcAtual), {
          epc: epcAtual,
          peso_kg: pesoAtual,
          data_entrada: serverTimestamp()
        });

        await addDoc(collection(db, "movimentacoes_fardos"), {
          epc: epcAtual,
          operacao: "PRENSA",
          peso_kg: pesoAtual,
          dispositivo: "Bluebird-EF401",
          criado_em: serverTimestamp()
        });

        resetarTelaEspera(`<div class="alerta-ok">ENTRADA GRAVADA (${pesoAtual.toFixed(2)} kg)!</div>`);
      } catch (err) {
        alert("Erro ao gravar entrada: " + err.message);
        if (btn) btn.disabled = false;
      }
    };

    window.confirmarCarregamento = async function() {
      const btn = document.getElementById("btnConfirmar");
      if (btn) btn.disabled = true;

      try {
        await deleteDoc(doc(db, "estoque_atual", epcAtual));

        await addDoc(collection(db, "movimentacoes_fardos"), {
          epc: epcAtual,
          operacao: "CARREGAMENTO",
          peso_kg: pesoAtual,
          dispositivo: "Bluebird-EF401",
          criado_em: serverTimestamp()
        });

        resetarTelaEspera(`<div class="alerta-ok">BAIXA CONFIRMADA (${pesoAtual.toFixed(2)} kg)!</div>`);
      } catch (err) {
        alert("Erro ao confirmar baixa: " + err.message);
        if (btn) btn.disabled = false;
      }
    };

    window.cancelarLeitura = function() {
      resetarTelaEspera();
    };
  </script>
</body>
</html>
