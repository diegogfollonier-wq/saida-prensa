<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Estoque RFID • Coletor & Painel</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --card: #ffffff;
      --border: #334155;
      --border-light: #e2e8f0;
      --text-dark: #0f172a;
      --muted: #64748b;
      --green: #16a34a;
      --orange: #ea580c;
      --red: #dc2626;
      --blue: #2563eb;
      --sky: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: #f8fafc;
      min-height: 100vh;
      padding: 12px;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* TOPO COMPACTO E CLARO */
    .top {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .top-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--sky);
    }

    .top-sub {
      font-size: 12px;
      color: #cbd5e1;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
    }

    button:active { opacity: 0.85; }

    .btn-green { background: var(--green); }
    .btn-orange { background: var(--orange); }
    .btn-red { background: var(--red); }
    .btn-blue { background: var(--blue); }
    .btn-gray { background: #475569; }

    /* RESUMO EM 3 CARDS */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .card-kpi {
      border-radius: 10px;
      padding: 14px;
      color: #fff;
    }

    .card-kpi.saldo { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .card-kpi.entrada { background: linear-gradient(135deg, #16a34a, #15803d); }
    .card-kpi.saida { background: linear-gradient(135deg, #ea580c, #c2410c); }

    .card-kpi small {
      font-size: 11px;
      text-transform: uppercase;
      opacity: 0.9;
      font-weight: 700;
    }

    .card-kpi strong {
      display: block;
      font-size: 20px;
      margin-top: 4px;
    }

    .card-kpi span {
      font-size: 12px;
      opacity: 0.9;
    }

    /* CAIXA DE CONFERÊNCIA QUANDO LÊ RFID */
    .leitura-box {
      background: #172554;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      display: none;
    }

    .leitura-box.ativa {
      display: block;
    }

    .leitura-box.duplicada {
      background: #450a0a;
      border-color: #f87171;
    }

    .leitura-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .leitura-alerta {
      font-size: 13px;
      font-weight: 800;
      color: #fde047;
    }

    .leitura-box.duplicada .leitura-alerta {
      color: #fca5a5;
    }

    .epc-display {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 13px;
      color: #7dd3fc;
      word-break: break-all;
      margin-bottom: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 11px;
      color: #cbd5e1;
      margin-bottom: 4px;
      font-weight: 700;
    }

    .field input, .field select {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    .tipo-escolha {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .btn-tipo {
      padding: 12px;
      border: 2px solid transparent;
      opacity: 0.7;
    }

    .btn-tipo.selecionado {
      opacity: 1;
      border-color: #fff;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.25);
    }

    .confirma-acoes {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }

    /* LISTA / TABELA CLARA */
    .painel-lista {
      background: var(--card);
      color: var(--text-dark);
      border-radius: 12px;
      padding: 14px;
    }

    .lista-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .lista-header h2 {
      font-size: 15px;
      font-weight: 800;
    }

    .busca-input {
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      min-width: 220px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border-light);
      text-align: left;
    }

    th {
      background: #f8fafc;
      font-size: 11px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .badge-mov {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
    }

    .b-entrada { background: #dcfce7; color: #166534; }
    .b-saida { background: #ffedd5; color: #9a3412; }

    .mono { font-family: monospace; font-size: 12px; }

    @media (max-width: 640px) {
      .cards { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .busca-input { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div>
        <div class="top-title">CONTROLE DE ESTOQUE RFID</div>
        <div class="top-sub" id="statusLeitor">Aguardando leitura do RFR900...</div>
      </div>
      <div class="top-actions">
        <button class="btn-blue" onclick="simularLeitura()">Simular Leitura RFID</button>
        <button class="btn-gray" onclick="exportarCSV()">CSV</button>
        <button class="btn-red" onclick="limparTudo()">Limpar</button>
      </div>
    </div>

    <div class="cards">
      <div class="card-kpi saldo">
        <small>Saldo em Estoque</small>
        <strong id="kpiSaldoPeso">0,0 kg</strong>
        <span id="kpiSaldoQtd">0 fardos</span>
      </div>
      <div class="card-kpi entrada">
        <small>Entradas</small>
        <strong id="kpiEntradaPeso">0,0 kg</strong>
        <span id="kpiEntradaQtd">0 fardos</span>
      </div>
      <div class="card-kpi saida">
        <small>Saídas</small>
        <strong id="kpiSaidaPeso">0,0 kg</strong>
        <span id="kpiSaidaQtd">0 fardos</span>
      </div>
    </div>

    <!-- MODAL / CAIXA VISUAL DE CONFERÊNCIA AO LER RFID -->
    <div id="leituraBox" class="leitura-box">
      <div class="leitura-topo">
        <span id="leituraAlerta" class="leitura-alerta">ETIQUETA LIDA — CONFIRME OS DADOS</span>
        <span id="leituraId" style="font-size:12px;font-weight:700;color:#cbd5e1;"></span>
      </div>

      <div id="leituraEpc" class="epc-display">---</div>

      <div class="tipo-escolha">
        <button type="button" id="btnTipoEntrada" class="btn-green btn-tipo selecionado" onclick="escolherTipo('ENTRADA')">
          ↓ ENTRADA (Prensa)
        </button>
        <button type="button" id="btnTipoSaida" class="btn-orange btn-tipo" onclick="escolherTipo('SAIDA')">
          ↑ SAÍDA (Expedição)
        </button>
      </div>

      <div class="form-grid">
        <div class="field">
          <label>Peso (kg)</label>
          <input type="number" id="inputPeso" step="0.1" />
        </div>
        <div class="field">
          <label>Material</label>
          <select id="inputMaterial">
            <option value="Papelão Ondulado">Papelão Ondulado</option>
            <option value="Plástico PET">Plástico PET</option>
            <option value="Plástico Filme">Plástico Filme</option>
            <option value="Fardo Prensado">Fardo Prensado</option>
          </select>
        </div>
      </div>

      <div class="confirma-acoes">
        <button type="button" class="btn-green" onclick="confirmarLeitura()">CONFIRMAR E GRAVAR</button>
        <button type="button" class="btn-gray" onclick="cancelarLeitura()">CANCELAR</button>
      </div>
    </div>

    <div class="painel-lista">
      <div class="lista-header">
        <h2>Movimentações (Entradas e Saídas)</h2>
        <input type="text" id="filtroBusca" class="busca-input" placeholder="Buscar ID ou EPC..." oninput="renderizar()" />
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Tipo</th>
              <th>ID</th>
              <th>EPC RFID</th>
              <th>Material</th>
              <th>Peso</th>
              <th>Data/Hora</th>
              <th>Obs.</th>
            </tr>
          </thead>
          <tbody id="corpoTabela"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const KEY = 'estoque_rfid_limpo_v1';
    let movs = JSON.parse(localStorage.getItem(KEY) || '[]');
    let pendente = null;
    let tipoSelecionado = 'ENTRADA';
    let jaExistiaNoEstoque = false;

    function calcularSaldo() {
      const mapa = new Map();
      [...movs].reverse().forEach(m => {
        if (m.tipo === 'ENTRADA') mapa.set(m.epc, m);
        if (m.tipo === 'SAIDA') mapa.delete(m.epc);
      });
      return Array.from(mapa.values());
    }

    function gerarId() {
      const d = new Date();
      const data = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
      const seq = String(movs.length + 1).padStart(3, '0');
      return `FRD-${data}-${seq}`;
    }

    function escolherTipo(tipo) {
      tipoSelecionado = tipo;
      document.getElementById('btnTipoEntrada').classList.toggle('selecionado', tipo === 'ENTRADA');
      document.getElementById('btnTipoSaida').classList.toggle('selecionado', tipo === 'SAIDA');
    }

    // Chamada pelo Android quando o RFR900 lê uma tag
    window.receberRFID = function(epcBruto) {
      if (!epcBruto) return;
      const epc = String(epcBruto).replace(/\s+/g, '').toUpperCase();
      const saldo = calcularSaldo();
      const existente = saldo.find(i => i.epc === epc);

      jaExistiaNoEstoque = Boolean(existente);
      const box = document.getElementById('leituraBox');
      const alerta = document.getElementById('leituraAlerta');

      pendente = {
        id: existente ? existente.id : gerarId(),
        epc: epc,
        data: new Date().toLocaleString('pt-BR')
      };

      document.getElementById('leituraId').textContent = pendente.id;
      document.getElementById('leituraEpc').textContent = epc;

      escolherTipo(existente ? 'SAIDA' : 'ENTRADA');

      const pesoSugerido = existente
        ? Number(existente.peso).toFixed(1)
        : (Math.random() * (260 - 180) + 180).toFixed(1);

      document.getElementById('inputPeso').value = pesoSugerido;
      if (existente && existente.material) {
        const sel = document.getElementById('inputMaterial');
        if ([...sel.options].some(o => o.value === existente.material)) {
          sel.value = existente.material;
        }
      }

      if (existente) {
        box.className = 'leitura-box ativa duplicada';
        alerta.textContent = `ALERTA: Etiqueta já consta no estoque (${existente.id} • ${Number(existente.peso).toFixed(1)} kg). Deseja SAÍDA ou REGRAVAR?`;
      } else {
        box.className = 'leitura-box ativa';
        alerta.textContent = 'NOVA ETIQUETA LIDA — Escolha ENTRADA ou SAÍDA e confirme';
      }

      document.getElementById('statusLeitor').textContent = 'Tag lida: ' + epc.slice(-8) + ' (aguardando confirmação)';
    };

    function confirmarLeitura() {
      if (!pendente) return;
      const pesoNum = parseFloat(String(document.getElementById('inputPeso').value).replace(',', '.'));
      if (isNaN(pesoNum) || pesoNum <= 0) {
        alert('Informe um peso válido.');
        return;
      }

      let obs = 'RFR900 / EF401';
      if (tipoSelecionado === 'ENTRADA' && jaExistiaNoEstoque) {
        movs = movs.filter(m => !(m.epc === pendente.epc && m.tipo === 'ENTRADA'));
        obs = 'RFR900 / EF401 (Regravado)';
      }

      movs.unshift({
        id: pendente.id,
        epc: pendente.epc,
        tipo: tipoSelecionado,
        material: document.getElementById('inputMaterial').value,
        peso: Number(pesoNum.toFixed(1)),
        data: new Date().toLocaleString('pt-BR'),
        obs: obs
      });

      localStorage.setItem(KEY, JSON.stringify(movs));
      cancelarLeitura();
      document.getElementById('statusLeitor').textContent = 'Gravado com sucesso! Pronto para próxima leitura.';
      renderizar();
    }

    function cancelarLeitura() {
      pendente = null;
      jaExistiaNoEstoque = false;
      document.getElementById('leituraBox').className = 'leitura-box';
    }

    function simularLeitura() {
      const saldo = calcularSaldo();
      if (saldo.length > 0 && Math.random() < 0.45) {
        window.receberRFID(saldo[0].epc);
      } else {
        const hex = Math.floor(Math.random() * 0xFFFFFF).toString(16).toUpperCase().padStart(6, '0');
        window.receberRFID('3400E2801170400002' + hex);
      }
    }

    function fmtKg(v) {
      return Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' kg';
    }

    function renderizar() {
      const saldo = calcularSaldo();
      const entradas = movs.filter(m => m.tipo === 'ENTRADA');
      const saidas = movs.filter(m => m.tipo === 'SAIDA');

      document.getElementById('kpiSaldoPeso').textContent = fmtKg(saldo.reduce((a, b) => a + Number(b.peso), 0));
      document.getElementById('kpiSaldoQtd').textContent = `${saldo.length} fardos`;

      document.getElementById('kpiEntradaPeso').textContent = fmtKg(entradas.reduce((a, b) => a + Number(b.peso), 0));
      document.getElementById('kpiEntradaQtd').textContent = `${entradas.length} fardos`;

      document.getElementById('kpiSaidaPeso').textContent = fmtKg(saidas.reduce((a, b) => a + Number(b.peso), 0));
      document.getElementById('kpiSaidaQtd').textContent = `${saidas.length} fardos`;

      const termo = (document.getElementById('filtroBusca').value || '').toLowerCase();
      const filtrados = movs.filter(m =>
        m.id.toLowerCase().includes(termo) ||
        m.epc.toLowerCase().includes(termo) ||
        m.material.toLowerCase().includes(termo)
      );

      document.getElementById('corpoTabela').innerHTML = filtrados.length
        ? filtrados.map(m => `
            <tr>
              <td><span class="badge-mov ${m.tipo === 'ENTRADA' ? 'b-entrada' : 'b-saida'}">${m.tipo}</span></td>
              <td><strong>${m.id}</strong></td>
              <td class="mono">${m.epc}</td>
              <td>${m.material}</td>
              <td><strong>${Number(m.peso).toFixed(1)} kg</strong></td>
              <td>${m.data}</td>
              <td>${m.obs}</td>
            </tr>
          `).join('')
        : '<tr><td colspan="7" style="text-align:center;color:#64748b;">Nenhuma movimentação registrada.</td></tr>';
    }

    function exportarCSV() {
      if (!movs.length) return alert('Sem dados para exportar.');
      const cab = 'TIPO;ID;EPC;MATERIAL;PESO_KG;DATA_HORA;OBS\n';
      const linhas = movs.map(m => `${m.tipo};${m.id};${m.epc};${m.material};${String(m.peso).replace('.', ',')};${m.data};${m.obs}`).join('\n');
      const blob = new Blob(['\uFEFF' + cab + linhas], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `estoque_rfid_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function limparTudo() {
      if (!movs.length) return;
      if (confirm('Apagar todas as movimentações?')) {
        movs = [];
        localStorage.setItem(KEY, JSON.stringify(movs));
        renderizar();
      }
    }

    renderizar();
  </script>
</body>
</html>
