<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estoque RFID</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 10px;
    }
    .topo {
      background: #1e293b;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .topo h2 {
      margin: 0 0 4px 0;
      font-size: 16px;
      color: #38bdf8;
    }
    .cards {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .card {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
    }
    .c-saldo { background: #2563eb; }
    .c-ent { background: #16a34a; }
    .c-sai { background: #ea580c; }
    .card span { font-size: 11px; display: block; opacity: 0.9; }
    .card strong { font-size: 16px; display: block; margin-top: 4px; }
    .box-leitura {
      display: none;
      background: #172554;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .box-leitura.visivel { display: block; }
    .box-leitura.duplicada { background: #450a0a; border-color: #f87171; }
    .epc-txt {
      background: #0f172a;
      padding: 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      margin: 6px 0;
      color: #7dd3fc;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      margin: 4px 0 8px 0;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
    }
    button {
      padding: 9px 12px;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-right: 6px;
      margin-bottom: 6px;
    }
    .b-verde { background: #16a34a; }
    .b-laranja { background: #ea580c; }
    .b-azul { background: #2563eb; }
    .b-cinza { background: #475569; }
    .b-vermelho { background: #dc2626; }
    .lista {
      background: #ffffff;
      color: #0f172a;
      border-radius: 8px;
      padding: 10px;
    }
    .item {
      border-bottom: 1px solid #e2e8f0;
      padding: 8px 0;
      font-size: 12px;
    }
    .item:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="topo">
    <h2>CONTROLE DE ESTOQUE RFID</h2>
    <div id="msgStatus" style="font-size:12px;color:#cbd5e1;">Pronto para leitura RFID</div>
    <div style="margin-top:8px;">
      <button type="button" class="b-azul" onclick="simularTag()">Simular Leitura</button>
      <button type="button" class="b-vermelho" onclick="limparLista()">Limpar</button>
    </div>
  </div>

  <div class="cards">
    <div class="card c-saldo">
      <span>SALDO</span>
      <strong id="vSaldo">0,0 kg</strong>
      <small id="qSaldo">0 fardos</small>
    </div>
    <div class="card c-ent">
      <span>ENTRADAS</span>
      <strong id="vEnt">0,0 kg</strong>
      <small id="qEnt">0 fardos</small>
    </div>
    <div class="card c-sai">
      <span>SAÍDAS</span>
      <strong id="vSai">0,0 kg</strong>
      <small id="qSai">0 fardos</small>
    </div>
  </div>

  <div id="boxLeitura" class="box-leitura">
    <div id="avisoTag" style="font-weight:bold;color:#fde047;font-size:13px;">Etiqueta lida</div>
    <div id="epcLido" class="epc-txt">---</div>

    <div>
      <button type="button" id="btnTipoEnt" class="b-verde" onclick="setTipo('ENTRADA')">ENTRADA</button>
      <button type="button" id="btnTipoSai" class="b-laranja" onclick="setTipo('SAIDA')">SAÍDA</button>
    </div>

    <label style="font-size:12px;">Peso (kg):</label>
    <input type="text" id="pesoInp" value="210.0" />

    <label style="font-size:12px;">Material:</label>
    <select id="matInp">
      <option value="Papelao">Papelao</option>
      <option value="Plastico">Plastico</option>
      <option value="Fardo">Fardo</option>
    </select>

    <div>
      <button type="button" class="b-verde" onclick="salvarTag()">GRAVAR</button>
      <button type="button" class="b-cinza" onclick="fecharBox()">CANCELAR</button>
    </div>
  </div>

  <div class="lista">
    <strong style="display:block;margin-bottom:6px;">Movimentações</strong>
    <div id="listaMov">Nenhuma movimentação.</div>
  </div>

  <script>
    var STORAGE_KEY = 'rfid_simples_v1';
    var registros = [];
    var tagAtual = '';
    var tipoAtual = 'ENTRADA';
    var jaExiste = false;

    try {
      var salvo = localStorage.getItem(STORAGE_KEY);
      if (salvo) registros = JSON.parse(salvo);
    } catch (e) {
      registros = [];
    }

    function setTipo(t) {
      tipoAtual = t;
      document.getElementById('btnTipoEnt').style.outline = (t === 'ENTRADA') ? '2px solid #fff' : 'none';
      document.getElementById('btnTipoSai').style.outline = (t === 'SAIDA') ? '2px solid #fff' : 'none';
    }

    function buscarEmEstoque(epc) {
      for (var i = registros.length - 1; i >= 0; i--) {
        if (registros[i].epc === epc) {
          return registros[i].tipo === 'ENTRADA' ? registros[i] : null;
        }
      }
      return null;
    }

    window.receberRFID = function(codigo) {
      if (!codigo) return;
      var limpo = String(codigo).replace(/\s+/g, '').toUpperCase();
      tagAtual = limpo;

      var achado = buscarEmEstoque(limpo);
      jaExiste = achado !== null;

      var box = document.getElementById('boxLeitura');
      var aviso = document.getElementById('avisoTag');

      document.getElementById('epcLido').innerHTML = limpo;

      if (jaExiste) {
        box.className = 'box-leitura visivel duplicada';
        aviso.innerHTML = 'ALERTA: RFID já está em estoque (' + achado.peso + ' kg). Escolha SAÍDA ou GRAVAR para regravar.';
        setTipo('SAIDA');
        document.getElementById('pesoInp').value = achado.peso;
      } else {
        box.className = 'box-leitura visivel';
        aviso.innerHTML = 'Nova leitura RFID — escolha ENTRADA ou SAÍDA e clique em GRAVAR.';
        setTipo('ENTRADA');
        document.getElementById('pesoInp').value = (Math.floor(Math.random() * 70) + 190) + '.0';
      }

      document.getElementById('msgStatus').innerHTML = 'Tag recebida: ' + limpo;
    };

    function salvarTag() {
      if (!tagAtual) return;
      var pTxt = String(document.getElementById('pesoInp').value).replace(',', '.');
      var pesoNum = parseFloat(pTxt);
      if (isNaN(pesoNum) || pesoNum <= 0) {
        document.getElementById('msgStatus').innerHTML = 'Peso invalido!';
        return;
      }

      var obs = 'RFR900';
      if (tipoAtual === 'ENTRADA' && jaExiste) {
        obs = 'RFR900 (Regravado)';
      }

      var agora = new Date();
      var horaStr = agora.toLocaleDateString('pt-BR') + ' ' + agora.toLocaleTimeString('pt-BR');

      registros.push({
        tipo: tipoAtual,
        epc: tagAtual,
        material: document.getElementById('matInp').value,
        peso: pesoNum.toFixed(1),
        data: horaStr,
        obs: obs
      });

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(registros));
      } catch (e) {}

      fecharBox();
      document.getElementById('msgStatus').innerHTML = 'Gravado: ' + tagAtual;
      atualizarTela();
    }

    function fecharBox() {
      tagAtual = '';
      jaExiste = false;
      document.getElementById('boxLeitura').className = 'box-leitura';
    }

    function simularTag() {
      var rnd = Math.floor(Math.random() * 899999 + 100000);
      window.receberRFID('3400E2801170400002' + rnd);
    }

    function limparLista() {
      registros = [];
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      fecharBox();
      document.getElementById('msgStatus').innerHTML = 'Lista limpa.';
      atualizarTela();
    }

    function atualizarTela() {
      var entPeso = 0, entQtd = 0;
      var saiPeso = 0, saiQtd = 0;
      var mapaSaldo = {};

      for (var i = 0; i < registros.length; i++) {
        var r = registros[i];
        var p = parseFloat(r.peso) || 0;
        if (r.tipo === 'ENTRADA') {
          entPeso += p;
          entQtd++;
          mapaSaldo[r.epc] = p;
        } else if (r.tipo === 'SAIDA') {
          saiPeso += p;
          saiQtd++;
          delete mapaSaldo[r.epc];
        }
      }

      var saldoPeso = 0, saldoQtd = 0;
      for (var k in mapaSaldo) {
        if (mapaSaldo.hasOwnProperty(k)) {
          saldoPeso += mapaSaldo[k];
          saldoQtd++;
        }
      }

      document.getElementById('vSaldo').innerHTML = saldoPeso.toFixed(1).replace('.', ',') + ' kg';
      document.getElementById('qSaldo').innerHTML = saldoQtd + ' fardos';

      document.getElementById('vEnt').innerHTML = entPeso.toFixed(1).replace('.', ',') + ' kg';
      document.getElementById('qEnt').innerHTML = entQtd + ' fardos';

      document.getElementById('vSai').innerHTML = saiPeso.toFixed(1).replace('.', ',') + ' kg';
      document.getElementById('qSai').innerHTML = saiQtd + ' fardos';

      if (registros.length === 0) {
        document.getElementById('listaMov').innerHTML = 'Nenhuma movimentação.';
        return;
      }

      var html = '';
      for (var j = registros.length - 1; j >= 0; j--) {
        var item = registros[j];
        html += '<div class="item">' +
          '<strong>[' + item.tipo + ']</strong> ' + item.peso + ' kg - ' + item.material + '<br/>' +
          '<span style="font-family:monospace;">' + item.epc + '</span><br/>' +
          '<span style="color:#64748b;">' + item.data + ' • ' + item.obs + '</span>' +
          '</div>';
      }
      document.getElementById('listaMov').innerHTML = html;
    }

    atualizarTela();
  </script>
</body>
</html>
