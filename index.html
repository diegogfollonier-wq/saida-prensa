<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fardos RFID</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 14px;
    }
    .tela {
      display: none;
    }
    .tela.ativa {
      display: block;
    }
    .modo-topo {
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 14px;
      background: #1e293b;
    }
    .modo-entrada {
      background: #14532d;
      color: #86efac;
      border: 1px solid #22c55e;
    }
    .modo-saida {
      background: #7c2d12;
      color: #fdba74;
      border: 1px solid #f97316;
    }
    .grid-acao {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 10px;
    }
    .btn-grande {
      width: 100%;
      padding: 22px 16px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      color: #ffffff;
      cursor: pointer;
    }
    .btn-entrada {
      background: #16a34a;
    }
    .btn-saida {
      background: #ea580c;
    }
    .btn-confirmar {
      width: 100%;
      padding: 18px 14px;
      font-size: 19px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #16a34a;
      color: #ffffff;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-refazer {
      width: 100%;
      padding: 16px 14px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #475569;
      color: #ffffff;
      cursor: pointer;
    }
    .painel {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .epc-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 15px;
      color: #38bdf8;
      word-break: break-all;
      text-align: center;
      margin-bottom: 14px;
    }
    .peso-box {
      background: #0f172a;
      border: 2px solid #22c55e;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      margin-bottom: 14px;
    }
    .peso-label {
      font-size: 13px;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
    }
    .peso-valor {
      font-size: 30px;
      font-weight: bold;
      color: #ffffff;
    }
    .alerta-box {
      background: #450a0a;
      border: 2px solid #ef4444;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      margin-bottom: 14px;
    }
    .alerta-titulo {
      font-size: 28px;
      font-weight: bold;
      color: #fca5a5;
      margin-bottom: 10px;
    }
    .alerta-texto {
      font-size: 20px;
      font-weight: bold;
      color: #ffffff;
      line-height: 1.35;
      margin-bottom: 12px;
    }
    .status-rodape {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      color: #cbd5e1;
      min-height: 20px;
    }
    .teste-discreto {
      margin-top: 24px;
      padding-top: 10px;
      border-top: 1px solid #1e293b;
      text-align: center;
    }
    .btn-teste {
      background: #334155;
      color: #e2e8f0;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- TELA 1: INICIAL (SOMENTE ENTRADA E SAIDA) -->
  <div id="telaInicial" class="tela ativa">
    <div id="badgeOperacao" class="modo-topo">OPERAÇÃO: SELECIONE</div>

    <div class="grid-acao">
      <button type="button" class="btn-grande btn-entrada" onclick="escolherOperacao('ENTRADA')">
        ENTRADA
      </button>
      <button type="button" class="btn-grande btn-saida" onclick="escolherOperacao('SAIDA')">
        SAÍDA
      </button>
    </div>

    <div id="statusInicial" class="status-rodape"></div>

    <div class="teste-discreto">
      <button type="button" class="btn-teste" onclick="simularLeituraRfid()">Simular Tag RFID</button>
    </div>
  </div>

  <!-- TELA 2: NOVO FARDO (PESO AUTOMATICO SIMULADO -> CONFIRMAR OU REFAZER) -->
  <div id="telaNovo" class="tela">
    <div id="topoNovo" class="modo-topo modo-entrada">ENTRADA - NOVO FARDO</div>

    <div class="painel">
      <div id="epcNovo" class="epc-box">---</div>

      <div class="peso-box">
        <span class="peso-label">PESO (SIMULADO)</span>
        <span id="pesoNovo" class="peso-valor">220,0 kg</span>
      </div>

      <button type="button" class="btn-confirmar" onclick="confirmarGravacao()">
        CONFIRMAR GRAVAÇÃO
      </button>
      <button type="button" class="btn-refazer" onclick="refazerLeitura()">
        REFAZER
      </button>
    </div>
  </div>

  <!-- TELA 3: FARDO JA CADASTRADO -->
  <div id="telaExistente" class="tela">
    <div class="alerta-box">
      <div class="alerta-titulo">ATENÇÃO</div>
      <div class="alerta-texto">ESTE FARDO JÁ ESTÁ CADASTRADO, MODIFICAR?</div>
      <div id="epcExistente" class="epc-box">---</div>
      <div id="pesoExistente" class="peso-label" style="font-size:16px;color:#fecaca;"></div>
    </div>

    <button type="button" class="btn-confirmar" onclick="confirmarGravacao()">
      MODIFICAR / GRAVAR
    </button>
    <button type="button" class="btn-refazer" onclick="refazerLeitura()">
      CANCELAR / REFAZER
    </button>
  </div>

  <script>
    var STORAGE_KEY = 'fardos_rfid_cadastrados_v1';
    var fardos = {};
    var operacaoAtual = 'ENTRADA';
    var epcAtual = '';
    var pesoAtual = 0;

    try {
      var salvo = localStorage.getItem(STORAGE_KEY);
      if (salvo) {
        fardos = JSON.parse(salvo) || {};
      }
    } catch (e) {
      fardos = {};
    }

    function salvarStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(fardos));
      } catch (e) {}
    }

    function liberarAndroid() {
      try {
        if (window.AndroidSingleTag && typeof window.AndroidSingleTag.liberarProximaEtiqueta === 'function') {
          window.AndroidSingleTag.liberarProximaEtiqueta();
        }
      } catch (e) {}
    }

    function mostrarTela(idTela) {
      document.getElementById('telaInicial').className = 'tela';
      document.getElementById('telaNovo').className = 'tela';
      document.getElementById('telaExistente').className = 'tela';
      document.getElementById(idTela).className = 'tela ativa';
    }

    function atualizarBadgeOperacao() {
      var badge = document.getElementById('badgeOperacao');
      if (operacaoAtual === 'SAIDA') {
        badge.className = 'modo-topo modo-saida';
        badge.innerHTML = 'OPERAÇÃO ATUAL: SAÍDA';
      } else {
        badge.className = 'modo-topo modo-entrada';
        badge.innerHTML = 'OPERAÇÃO ATUAL: ENTRADA';
      }
    }

    function escolherOperacao(tipo) {
      operacaoAtual = tipo;
      atualizarBadgeOperacao();
      document.getElementById('statusInicial').innerHTML = 'Aproxime a etiqueta RFID do fardo...';
    }

    function gerarPesoSimulado() {
      var kg = Math.floor(Math.random() * 121) + 180; // 180 a 300 kg
      return Number(kg).toFixed(1);
    }

    window.receberRFID = function(codigo) {
      if (!codigo || epcAtual) return;
      var limpo = String(codigo).replace(/\s+/g, '').toUpperCase();
      if (!limpo) return;

      epcAtual = limpo;

      if (Object.prototype.hasOwnProperty.call(fardos, limpo)) {
        var registro = fardos[limpo];
        pesoAtual = registro.peso || gerarPesoSimulado();
        document.getElementById('epcExistente').innerHTML = limpo;
        document.getElementById('pesoExistente').innerHTML = 'Último peso: ' + String(pesoAtual).replace('.', ',') + ' kg';
        mostrarTela('telaExistente');
      } else {
        pesoAtual = gerarPesoSimulado();
        var topoNovo = document.getElementById('topoNovo');
        if (operacaoAtual === 'SAIDA') {
          topoNovo.className = 'modo-topo modo-saida';
          topoNovo.innerHTML = 'SAÍDA - NOVO FARDO';
        } else {
          topoNovo.className = 'modo-topo modo-entrada';
          topoNovo.innerHTML = 'ENTRADA - NOVO FARDO';
        }
        document.getElementById('epcNovo').innerHTML = limpo;
        document.getElementById('pesoNovo').innerHTML = String(pesoAtual).replace('.', ',') + ' kg';
        mostrarTela('telaNovo');
      }
    };

    function confirmarGravacao() {
      if (!epcAtual) return;
      fardos[epcAtual] = {
        epc: epcAtual,
        peso: pesoAtual,
        operacao: operacaoAtual,
        atualizadoEm: new Date().toISOString()
      };
      salvarStorage();

      var gravado = epcAtual;
      epcAtual = '';
      mostrarTela('telaInicial');
      atualizarBadgeOperacao();
      document.getElementById('statusInicial').innerHTML = 'Gravado: ' + gravado;
      liberarAndroid();
    }

    function refazerLeitura() {
      epcAtual = '';
      mostrarTela('telaInicial');
      atualizarBadgeOperacao();
      document.getElementById('statusInicial').innerHTML = 'Leitura cancelada. Pronto para nova leitura.';
      liberarAndroid();
    }

    function simularLeituraRfid() {
      if (epcAtual) return;
      // Alterna entre gerar um novo fardo e reutilizar um já gravado para teste rápido
      var chaves = Object.keys(fardos);
      if (chaves.length > 0 && Math.random() < 0.45) {
        window.receberRFID(chaves[chaves.length - 1]);
      } else {
        var sufixo = Math.floor(Math.random() * 899999 + 100000);
        window.receberRFID('3400E2801170400002' + sufixo);
      }
    }

    atualizarBadgeOperacao();
  </script>
</body>
</html>
